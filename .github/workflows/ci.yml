name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore EmailValidation.sln

      - name: Build
        run: dotnet build EmailValidation.sln -c Release --no-restore

      - name: Test
        run: dotnet test EmailValidation.sln -c Release --no-build
